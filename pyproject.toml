[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    "ignore:From 0.4 .update:FutureWarning",
    "ignore:.*names are not unique.*:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
