{% if page_count > 1 %}
  <nav class="d-flex justify-content-between align-items-center mt-4" aria-label="Catalogue pages">
    {% if previous_url %}<a class="btn btn-outline-secondary" href="{{ previous_url }}">Previous</a>{% else %}<span></span>{% endif %}
    <span class="small text-secondary">Page {{ page }} of {{ page_count }}</span>
    {% if next_url %}<a class="btn btn-outline-secondary" href="{{ next_url }}">Next</a>{% else %}<span></span>{% endif %}
  </nav>
{% endif %}
