    provenance_audit:
      datasets_checked: 35
      methods: {source: 3, singler: 1, rctd: 31}
      exact_plan_parameter_matches: 35
      complete_inferred_reference_records: 32
      errors: 0
    verification:
      backend_pytest: {passed: 206, failed: 0, warnings: 1}
      annotation_python_pytest: {passed: 3, failed: 0}
      annotation_r_contracts: {passed: 2, failed: 0}
